<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>次黎曼 Nil 距离球比较</title><style>body{font:15px system-ui;margin:0;background:#f1f4f6;color:#1d2933}header{padding:14px 18px;background:white}main{padding:12px;max-width:1200px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:15px;padding:12px;background:white;border-radius:10px;margin-bottom:12px}label{display:flex;align-items:center;gap:8px}input[type=range]{width:130px}#view{height:65vh;min-height:420px;background:#e8edf1;border-radius:12px;touch-action:none}.note{font-size:13px;line-height:1.7;color:#52616d;padding:10px}button{padding:7px 12px;border:1px solid #c6d0d8;background:white;border-radius:7px}</style></head><body><header><b>欧几里得球 vs 次黎曼 Nil 距离球</b><div style="font-size:12px;color:#62717e">拖动旋转 · 双指缩放 · λ=1 时遵守 dz=x dy</div></header><main><div class="controls"><label>半径 R <input id="radius" type="range" min="0.5" max="5" step="0.1" value="2"><span id="rv">2</span></label><label>λ <input id="lambda" type="range" min="0.1" max="3" step="0.1" value="1"><span id="lv">1</span></label><label><input id="euclid" type="checkbox" checked>普通球（蓝色线框）</label><label><input id="nil" type="checkbox" checked>Nil 距离球（橙色）</label><button id="reset">重置视角</button></div><div id="view"></div><div class="note">数学定义：水平运动 dz=λx dy，长度 ∫√(dx²+dy²)。橙色表面由原点出发、长度为 R 的次黎曼最短测地线终点构成；采用参数 |u|≤2π（端点为割点），并在原点附近使用稳定的极限公式。它不是普通黎曼 Nil 的测地球。由于 λ 改变时竖直尺度会变化，两个球不会在所有方向重合。需要网络加载 Three.js。</div></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from "three";import {OrbitControls} from "three/addons/controls/OrbitControls.js";
const el=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color('#e8edf1');const camera=new THREE.PerspectiveCamera(48,1,.01,500);camera.position.set(6,-8,6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,-3,8);scene.add(light,new THREE.AmbientLight(0xffffff,1.5));scene.add(new THREE.AxesHelper(3));let nilObj,euObj;
function endpoint(R,lambda,u,phi){let a,b,z;if(Math.abs(u)<.0001){a=R;b=0;z=0;}else{a=R*Math.sin(u)/u;b=R*(1-Math.cos(u))/u;z=lambda*R*R*(u-Math.sin(u))/(2*u*u)}return [a*Math.cos(phi)-b*Math.sin(phi),a*Math.sin(phi)+b*Math.cos(phi),z]}
function makeNil(R,lambda){const positions=[],indices=[],N=120,M=96;for(let i=0;i<=N;i++){let u=-2*Math.PI+4*Math.PI*i/N;for(let j=0;j<=M;j++){let p=endpoint(R,lambda,u,2*Math.PI*j/M);positions.push(...p)}}for(let i=0;i<N;i++)for(let j=0;j<M;j++){let a=i*(M+1)+j,b=a+M+1;indices.push(a,b,a+1,b,b+1,a+1)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setIndex(indices);geo.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({color:0xe18a48,side:THREE.DoubleSide,transparent:true,opacity:.8,roughness:.65,metalness:.03});return new THREE.Mesh(geo,mat)}
function update(){let R=+document.getElementById('radius').value,lambda=+document.getElementById('lambda').value;document.getElementById('rv').textContent=R.toFixed(1);document.getElementById('lv').textContent=lambda.toFixed(1);if(nilObj){scene.remove(nilObj);nilObj.geometry.dispose();nilObj.material.dispose()}if(euObj){scene.remove(euObj);euObj.geometry.dispose();euObj.material.dispose()}nilObj=makeNil(R,lambda);scene.add(nilObj);euObj=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(R,24,14)),new THREE.LineBasicMaterial({color:0x3674b9,transparent:true,opacity:.45}));scene.add(euObj);nilObj.visible=document.getElementById('nil').checked;euObj.visible=document.getElementById('euclid').checked;controls.target.set(0,0,0);controls.update()}
for(const id of ['radius','lambda'])document.getElementById(id).addEventListener('input',update);for(const id of ['euclid','nil'])document.getElementById(id).addEventListener('change',()=>{nilObj.visible=document.getElementById('nil').checked;euObj.visible=document.getElementById('euclid').checked});document.getElementById('reset').onclick=()=>{camera.position.set(6,-8,6);controls.target.set(0,0,0);controls.update()};function resize(){let w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(el);resize();update();function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
