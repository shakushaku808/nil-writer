<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nil 模型变形实验器 · STL 导入</title>
<style>
body{margin:0;background:#eef2f5;color:#213342;font:15px system-ui,-apple-system,sans-serif}
header{padding:18px 24px;background:white}h2{margin:0 0 5px;font-size:21px}small{color:#657782}
main{max-width:1350px;margin:auto;padding:14px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:white;padding:15px;border-radius:12px;margin-bottom:12px}
button,.file{border:0;border-radius:7px;padding:10px 13px;background:#226387;color:white;cursor:pointer}
.file input{display:none}select{padding:8px}input[type=range]{width:110px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pane{background:white;border-radius:12px;overflow:hidden}
.pane b{display:block;padding:12px}.viewport{height:520px;background:#e8edf1;position:relative;touch-action:none}
canvas{display:block;width:100%;height:100%}#status{padding:10px 3px;color:#526c7b}
@media(max-width:750px){.views{grid-template-columns:1fr}.viewport{height:360px}}
</style></head><body>
<header><h2>Nil 空间 · 自定义 STL 变形实验</h2><small>本地导入 STL · 原始模型与 Nil 变形对照 · 导出 STL</small></header>
<main><div class="toolbar">
<label class="file">导入 STL<input id="file" type="file" accept=".stl"></label>
<label>模式 <select id="mode"><option value="exp">Nil 黎曼指数映射</option><option value="path">先 X 后 Y 路径变形</option></select></label>
<label>λ <input id="lam" type="range" min="0" max="2" step=".05" value=".5"><span id="lv">0.50</span></label>
<label>作用强度 <input id="strength" type="range" min="0" max="1" step=".05" value="1"><span id="sv">1.00</span></label>
<label><input id="wire" type="checkbox"> 显示网格</label>
<button id="reset">重置视角</button><button id="export">导出右侧 STL</button>
</div>
<div class="views"><section class="pane"><b>原始模型</b><div class="viewport" id="left"></div></section><section class="pane"><b>Nil 变形模型</b><div class="viewport" id="right"></div></section></div>
<div id="status">正在加载三维引擎……</div>
<small>数学定义：ds²=dx²+dy²+(dz−λxdy)²。指数映射将归一化后的顶点坐标视为原点初速度，沿 Nil 黎曼测地线走单位参数时间。路径模式采用 z'=z+λxy。两者都是指定的几何映射，不代表物体进入 Nil 空间后的唯一形态。模型在内部按最长边归一化，导出时恢复原始单位。</small></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.1';
import {STLLoader} from 'https://esm.sh/three@0.160.1/examples/jsm/loaders/STLLoader.js';
import {STLExporter} from 'https://esm.sh/three@0.160.1/examples/jsm/exporters/STLExporter.js';
import {OrbitControls} from 'https://esm.sh/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id), status=$('status');
const scenes=[], cameras=[],renderers=[],controls=[],meshes=[];
let original=null, center=new THREE.Vector3(), scale=1, filename='model';
function setup(id){
 const host=$(id),scene=new THREE.Scene();scene.background=new THREE.Color('#e8edf1');
 scene.add(new THREE.HemisphereLight(0xffffff,0x8493a5,2.2));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,7,9);scene.add(light);
 const camera=new THREE.PerspectiveCamera(40,1,.01,1000);camera.position.set(4,3,7);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
 const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,0,0);
 scenes.push(scene);cameras.push(camera);renderers.push(renderer);controls.push(orbit);
 function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
 new ResizeObserver(resize).observe(host);resize();
}
setup('left');setup('right');
function material(){return new THREE.MeshStandardMaterial({color:0x6fa7c5,metalness:.08,roughness:.68,side:THREE.DoubleSide,wireframe:$('wire').checked})}
function clear(){for(let i=0;i<2;i++){if(meshes[i]){scenes[i].remove(meshes[i]);meshes[i].geometry.dispose();meshes[i].material.dispose();meshes[i]=null}}}
function fit(){
 for(let i=0;i<2;i++){cameras[i].position.set(3.5,2.7,6);controls[i].target.set(0,0,0);controls[i].update()}
}
function expNil(x,y,z,l){
 // Exact unit-time Riemannian geodesic from identity for metric dx²+dy²+(dz−λxdy)².
 const w=l*z;
 if(Math.abs(w)<1e-8)return [x,y,z+l*x*y/2];
 const s=Math.sin(w),c=Math.cos(w);
 const X=(x*s+y*(c-1))/w, Y=(x*(1-c)+y*s)/w;
 const H=x*x+y*y;
 // z'=z0+λ X(t)Y'(t); integral X Y' over 0..1
 // X(t)=[x sin(wt)+y(cos(wt)-1)]/w, Y'(t)=x sin(wt)+y cos(wt)
 const I=(x*x*(.5-s*Math.cos(w)/(2*w))+
           x*y*(s*s/w)+(y*y*(.5+s*Math.cos(w)/(2*w)-s/w)))/w;
 return [X,Y,z+l*I];
}
function transform(){
 if(!original)return;
 const lam=+$('lam').value, k=+$('strength').value;
 $('lv').textContent=lam.toFixed(2);$('sv').textContent=k.toFixed(2);
 clear();
 const left=original.clone(), right=original.clone();
 const p=right.attributes.position;
 for(let i=0;i<p.count;i++){
  const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  let q=$('mode').value==='path'?[x,y,z+lam*x*y]:expNil(x,y,z,lam);
  p.setXYZ(i,x+k*(q[0]-x),y+k*(q[1]-y),z+k*(q[2]-z));
 }
 p.needsUpdate=true;right.computeVertexNormals();
 for(let i=0;i<2;i++){const mesh=new THREE.Mesh(i?right:left,material());scenes[i].add(mesh);meshes[i]=mesh}
}
function importGeometry(geometry,name){
 geometry=geometry.toNonIndexed ? geometry.toNonIndexed() : geometry;
 geometry.computeBoundingBox();const b=geometry.boundingBox;
 center=b.getCenter(new THREE.Vector3());scale=Math.max(...b.getSize(new THREE.Vector3()).toArray());
 if(!(scale>0))throw Error('模型尺寸无效');
 const arr=geometry.attributes.position;
 for(let i=0;i<arr.count;i++)arr.setXYZ(i,(arr.getX(i)-center.x)/scale,(arr.getY(i)-center.y)/scale,(arr.getZ(i)-center.z)/scale);
 arr.needsUpdate=true;geometry.computeVertexNormals();
 original=geometry;filename=name;transform();fit();
 status.textContent=`已导入 ${name} · ${Math.round(arr.count/3).toLocaleString()} 个三角面 · 原始最长边 ${scale.toFixed(3)}（STL 原始单位）`;
}
$('file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{status.textContent='正在读取 '+f.name;const buf=await f.arrayBuffer();const geom=new STLLoader().parse(buf);importGeometry(geom,f.name.replace(/\.stl$/i,''))}
 catch(err){status.textContent='导入失败：'+err.message;console.error(err)}
});
for(const id of ['mode','lam','strength','wire'])$(id).addEventListener('input',transform);
$('reset').onclick=fit;
$('export').onclick=()=>{
 if(!meshes[1])return alert('请先导入 STL');
 const geo=meshes[1].geometry.clone(),a=geo.attributes.position;
 for(let i=0;i<a.count;i++)a.setXYZ(i,a.getX(i)*scale+center.x,a.getY(i)*scale+center.y,a.getZ(i)*scale+center.z);
 a.needsUpdate=true;geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo);mesh.updateMatrixWorld(true);
 const out=new STLExporter().parse(mesh,{binary:true});
 const blob=new Blob([out],{type:'application/octet-stream'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download=filename+'_nil.stl';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);geo.dispose();
};
function animate(){requestAnimationFrame(animate);for(let i=0;i<2;i++){controls[i].update();renderers[i].render(scenes[i],cameras[i])}}animate();
status.textContent='三维引擎已加载。请点击「导入 STL」选择模型。';
</script></body></html>
